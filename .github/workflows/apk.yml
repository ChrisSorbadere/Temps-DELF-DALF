name: Construire l'APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-shell/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances Capacitor
        run: npm ci

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Numéro de version
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "APP_VERSION=$V" >> $GITHUB_ENV

      - name: Clé de signature (secrets GitHub)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD manquants (Settings › Secrets and variables › Actions)"
            exit 1
          fi
          echo "$KS" | base64 -d > android/app/release.jks

      - name: Distribution Gradle (plusieurs sources, nouveaux essais)
        run: |
          Z="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          for u in https://services.gradle.org/distributions/gradle-8.14.3-bin.zip \
                   https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip \
                   https://github.com/gradle/gradle-distributions/releases/download/v8.14.3/gradle-8.14.3-bin.zip; do
            for i in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 10 -o "$Z" "$u"; then echo "Gradle téléchargé depuis $u"; break 2; fi
              echo "::warning::Échec $u (essai $i)"; sleep 20
            done
          done
          test -s "$Z" || { echo "::error::Impossible de télécharger Gradle (serveurs GitHub/Gradle indisponibles) : relancer plus tard"; exit 1; }
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\://$Z#" android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Compiler l'APK signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ok=0
          for essai in 1 2 3 4; do
            if ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then ok=1; break; fi
            if grep -qE "Could not (download|resolve|GET|HEAD)|Read timed out|Connection reset|Server returned HTTP response code: 5[0-9][0-9]|timed out" build.log; then
              echo "::warning::Téléchargement Gradle raté (essai $essai), nouvel essai dans 60 s"; sleep 60
            else break; fi
          done
          if [ $ok -ne 1 ]; then
            grep -E -A3 "error:|What went wrong|Exception|e: " build.log | grep -v "^> Task" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../MesureLeTemps-${APP_VERSION}-b${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MesureLeTemps-apk
          path: MesureLeTemps-*.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: Mesure le temps Android ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: "Télécharge le fichier .apk ci-dessous sur le téléphone, ouvre-le et autorise l'installation. Les mises à jour de l'appli arrivent ensuite toutes seules ; un nouvel APK n'est nécessaire que pour les fonctions Android."
          files: MesureLeTemps-*.apk
          make_latest: true
